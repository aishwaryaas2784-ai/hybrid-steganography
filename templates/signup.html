<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | Hybrid Steganography Messenger</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container" style="max-width:420px; margin-top:60px;">
        <header>
            <h1>Create Account</h1>
            <p class="subtitle">Join the Secure Stego Messenger</p>
        </header>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">{% for msg in messages %}<p>{{ msg }}</p>{% endfor %}</div>
            {% endif %}
        {% endwith %}
        <div class="card">
            <form action="/signup" method="post">
                <label>Full Name</label>
                <input type="text" name="full_name" required>

                <label>Email</label>
                <input type="email" name="email" required>

                <label>Phone Number (optional)</label>
                <input type="text" name="phone">

                <label>Username</label>
                <input type="text" name="username" autocomplete="off" required>

                <label>Password (minimum 6 characters)</label>
                <input type="password" name="password" required>

                <button type="submit">Create Account</button>
            </form>
            <p style="text-align:center; margin-top:16px; color:#94a3b8;">
                Already have an account? <a href="/login" style="color:#38bdf8;">Log in</a>
            </p>
        </div>
    </div>
</body>
</html>
