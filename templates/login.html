<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Hybrid Steganography Messenger</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
    <svg class="side-decor left" width="140" height="180" viewBox="0 0 140 180" xmlns="http://www.w3.org/2000/svg">
        <rect x="30" y="70" width="80" height="70" rx="10" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.7"/>
        <path d="M45 70 v-20 a25 25 0 0 1 50 0 v20" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.7"/>
        <circle cx="70" cy="100" r="7" fill="#38bdf8" opacity="0.7"/>
        <rect x="67" y="105" width="6" height="16" fill="#38bdf8" opacity="0.7"/>
        <text x="10" y="40" font-family="monospace" font-size="14" fill="#a78bfa" opacity="0.5">1011</text>
        <text x="15" y="165" font-family="monospace" font-size="14" fill="#a78bfa" opacity="0.5">0110</text>
    </svg>

    <svg class="side-decor right" width="140" height="180" viewBox="0 0 140 180" xmlns="http://www.w3.org/2000/svg">
        <rect x="20" y="60" width="70" height="55" rx="6" fill="none" stroke="#f472b6" stroke-width="3.5" opacity="0.7"/>
        <circle cx="35" cy="72" r="4" fill="#f472b6" opacity="0.7"/>
        <circle cx="50" cy="72" r="4" fill="#f472b6" opacity="0.7"/>
        <circle cx="65" cy="72" r="4" fill="#f472b6" opacity="0.7"/>
        <path d="M30 95 l15 15 l25 -30" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
        <text x="90" y="45" font-family="monospace" font-size="14" fill="#38bdf8" opacity="0.5">1101</text>
        <text x="15" y="150" font-family="monospace" font-size="14" fill="#38bdf8" opacity="0.5">0011</text>
    </svg>

    <div class="container" style="max-width:420px; margin-top:70px;">
        <header>
            <h1>Secure Stego Messenger</h1>
            <p class="subtitle">Log in to your account</p>
        </header>

        <div class="quote-box">
            <p class="quote-text" id="quoteText">"The best hiding place is one nobody thinks to look."</p>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">{% for msg in messages %}<p>{{ msg }}</p>{% endfor %}</div>
            {% endif %}
        {% endwith %}
        <div class="card">
            <form action="/login" method="post">
                <label>Username</label>
                <input type="text" name="username" autocomplete="off" required>

                <label>Password</label>
                <input type="password" name="password" required>

                <button type="submit">Log In</button>
            </form>
            <p style="text-align:center; margin-top:16px; color:#94a3b8;">
                Don't have an account? <a href="/signup" style="color:#38bdf8;">Sign up</a>
            </p>
        </div>
    </div>

    <script>
        const quotes = [
            "The best hiding place is one nobody thinks to look.",
            "Encryption protects the message. Steganography hides that a message exists at all.",
            "In a world of surveillance, the quietest signal is the safest one.",
            "A picture is worth a thousand words — and sometimes, a few thousand secret bits too.",
            "True security is layered: what you encrypt, you also conceal."
        ];
        let qi = 0;
        setInterval(() => {
            qi = (qi + 1) % quotes.length;
            const el = document.getElementById("quoteText");
            el.style.opacity = 0;
            setTimeout(() => {
                el.textContent = '"' + quotes[qi] + '"';
                el.style.animation = "none";
                void el.offsetWidth;
                el.style.animation = "quoteFade 0.8s ease";
                el.style.opacity = 1;
            }, 300);
        }, 4500);

        document.querySelectorAll("button").forEach(btn => {
            btn.addEventListener("click", function(e) {
                const ripple = document.createElement("span");
                ripple.classList.add("ripple");
                const rect = this.getBoundingClientRect();
                ripple.style.left = (e.clientX - rect.left) + "px";
                ripple.style.top = (e.clientY - rect.top) + "px";
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });
    </script>
</body>
</html>
